<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema da Padaria</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f3f1ed;
}

.container{
    width:900px;
    margin:30px auto;
    background:white;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
    overflow:hidden;
}

.topo{
    background:#8B4513;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 30px;
}

.topo h1{
    margin:0;
    font-size:35px;
}

.menu-btn{
    background:white;
    color:#8B4513;
    border:none;
    padding:12px 25px;
    border-radius:30px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    transition:.3s;
}

.menu-btn:hover{
    background:#ffe5cc;
}

.conteudo{
    padding:30px;
}

h2{
    color:#8B4513;
    margin-bottom:15px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    background:#8B4513;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:8px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#6d3410;
}

hr{
    margin:30px 0;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#8B4513;
    color:white;
    padding:15px;
}

td{
    padding:15px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

tr:nth-child(even){
    background:#fafafa;
}

tr:hover{
    background:#fff5ec;
}

</style>

</head>
<body>

<div class="container">

<div class="topo">

<h1>🥖 Padaria Cacetinho</h1>

<button class="menu-btn" onclick="window.location.href='menu.html'">
📋 Ver Cardápio
</button>

</div>

<div class="conteudo">

<h2>Cadastrar Produto</h2>

<input type="text" id="nome" placeholder="Nome do produto">

<input type="number" id="preco" placeholder="Preço">

<input type="number" id="quantidade" placeholder="Quantidade">

<button onclick="cadastrar()">Cadastrar</button>

<hr>

<h2>Vender Produto</h2>

<input type="text" id="buscar" placeholder="Nome do produto">

<input type="number" id="comprar" placeholder="Quantidade">

<button onclick="vender()">Vender</button>

<hr>

<h2>Produtos Cadastrados</h2>

<table>

<thead>
<tr>
<th>Nome</th>
<th>Preço</th>
<th>Quantidade</th>
</tr>
</thead>

<tbody id="tabela">
</tbody>

</table>

</div>

</div>

<script>

let produtos=[];

function cadastrar(){

    let nome=document.getElementById("nome").value;
    let preco=parseFloat(document.getElementById("preco").value);
    let quantidade=parseInt(document.getElementById("quantidade").value);

    if(nome=="" || isNaN(preco) || isNaN(quantidade)){
        alert("Preencha todos os campos.");
        return;
    }

    produtos.push({
        nome:nome,
        preco:preco,
        quantidade:quantidade
    });

    atualizarTabela();

    document.getElementById("nome").value="";
    document.getElementById("preco").value="";
    document.getElementById("quantidade").value="";
}

function vender(){

    let nome=document.getElementById("buscar").value;
    let qtd=parseInt(document.getElementById("comprar").value);

    let encontrou=false;

    for(let i=0;i<produtos.length;i++){

        if(produtos[i].nome.toLowerCase()===nome.toLowerCase()){

            encontrou=true;

            if(qtd<=produtos[i].quantidade){

                produtos[i].quantidade-=qtd;

                alert("Total da compra: R$ "+(qtd*produtos[i].preco).toFixed(2));

            }else{

                alert("Estoque insuficiente.");

            }

            atualizarTabela();
            return;
        }
    }

    if(!encontrou){
        alert("Produto não encontrado.");
    }

}

function atualizarTabela(){

    let tabela=document.getElementById("tabela");

    tabela.innerHTML="";

    for(let i=0;i<produtos.length;i++){

        tabela.innerHTML+=`
        <tr>
            <td>${produtos[i].nome}</td>
            <td>R$ ${produtos[i].preco.toFixed(2)}</td>
            <td>${produtos[i].quantidade}</td>
        </tr>
        `;
    }

}

</script>

</body>
</html>
